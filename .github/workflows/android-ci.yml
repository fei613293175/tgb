name: Android build, emulator smoke, screenshots

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    name: Build and Android 36 emulator regression
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up and validate Gradle wrapper
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up locked Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools build-tools;36.0.0"

      - name: Install locked Android 37 compile SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --channel=3 "platforms;android-37.0"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"

      - name: Unit tests, lint and Debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleDebugAndroidTest

      - name: APK package, permission, size and secret gates
        shell: bash
        run: bash scripts/android/ci-apk-gates.sh

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, capture and inspect on Android 36
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save
          disable-animations: true
          script: bash scripts/android/ci-emulator-smoke.sh

      - name: Upload APK, screenshots, reports and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tuiguangbao-android-ci-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/reports/
            android-app/app/build/test-results/
            android-app/app/build/outputs/androidTest-results/
            ci-artifacts/

<style>
/* ===== 趣赚汇 · 暖白珊瑚红渐变风格 (购买超级头条页) ===== */
:root {
    --bg: #fff9f5;
    --card-bg: rgba(255, 255, 255, 0.85);
    --primary: #ff7b00;
    --primary-dark: #e63946;
    --primary-gradient: linear-gradient(135deg, #ff7b00, #e63946);
    --text-primary: #3d2b1a;
    --text-secondary: #8b6f5c;
    --text-tertiary: #b08968;
    --border-light: rgba(255, 200, 120, 0.35);
    --border-card: rgba(255, 190, 90, 0.35);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 20px 45px rgba(255,140,30,0.10), 0 4px 12px rgba(0,0,0,0.03);
    --shadow-red: 0 5px 15px rgba(255,50,0,0.25);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --radius-xl: 22px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(180deg, #fef9f0 0%, #fff5e6 30%, #fef3e2 60%, #fdf0db 100%) !important;
    color: var(--text-primary) !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif !important;
    overflow-x: hidden;
}

.z {
    float: left;
}

/* weui 组件边框颜色 */
.weui-cells::before,
.weui-cells::after,
.weui-cell::before {
    border-color: var(--border-light) !important;
}

.pr {
    position: relative;
}

em {
    font-style: normal;
}

/* 脉冲动画 - 红橙光效 */
.price-desc-btn {
    animation-duration: 1s;
    animation-iteration-count: infinite;
    animation-name: buttonAnimate;
    animation-timing-function: ease;
}

@keyframes buttonAnimate {
    50% {
        transform: scale(1.05);
    }
}

/* 主要内容区域 */
.main-content {
    margin-top: 100px;
    padding: 20px;
}

/* 任务列表容器 - 玻璃态白色卡片 */
.weui-cells.weui-cells_checkbox.mt0 {
    background: var(--card-bg) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid var(--border-card) !important;
    border-radius: var(--radius-lg) !important;
    margin: 15px !important;
    overflow-y: scroll;
    box-shadow: var(--shadow-md) !important;
    max-height: 300px;
    padding: 10px;
}

/* 任务项样式 */
.pr {
    margin-bottom: 12px;
}

.weui-cell.weui-check__label {
    background: var(--card-bg) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid var(--border-card) !important;
    border-radius: var(--radius-md) !important;
    padding: 16px !important;
    margin-bottom: 12px;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
}

.weui-cell.weui-check__label:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #ff7b00 !important;
}

/* 复选框选中样式 - 红橙主色调 */
.weui-check:checked + .weui-icon-checked:before {
    color: #ff7b00 !important;
    text-shadow: 0 0 5px rgba(255, 123, 0, 0.3);
}

.weui-icon-checked:before {
    color: var(--text-tertiary) !important;
}

/* 信息内容区域 */
.itc.c3 {
    background: transparent !important;
    padding: 10px !important;
    margin-bottom: 0 !important;
    border-radius: var(--radius-md) !important;
}

.f14 {
    display: flex;
    color: var(--text-primary) !important;
}

.c9 {
    color: var(--text-tertiary) !important;
    font-size: 12px;
    margin-bottom: 8px;
    display: block;
}

/* 已购买状态样式 - 红橙调 */
[style*="color:#16a34a"] {
    color: var(--primary-dark) !important;
    background: rgba(255, 123, 0, 0.08) !important;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    display: inline-block;
    margin-top: 4px;
    font-weight: 500;
    border: 1px solid rgba(255, 123, 0, 0.25);
}

/* 选择时长标题 */
.weui-cells__title.main_color {
    font-weight: 700 !important;
    margin-top: 20px !important;
    margin-bottom: 20px !important;
    color: var(--text-primary) !important;
    font-size: 20px !important;
    padding-left: 15px;
    border-left: 3px solid #ff7b00;
    display: inline-block;
    background: none;
    -webkit-text-fill-color: initial;
    color: var(--text-primary) !important;
}

/* 时长选择容器 */
.cl {
    background: var(--card-bg) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid var(--border-card) !important;
    border-radius: var(--radius-lg) !important;
    margin: 15px !important;
    padding: 15px !important;
    box-shadow: var(--shadow-md);
}

/* 时长选项项 */
.z {
    width: 100%;
    margin-bottom: 12px;
}

.z:last-child {
    margin-bottom: 0;
}

.z .weui-cell {
    background: rgba(255,245,235,0.7) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border: 1px solid var(--border-light) !important;
    border-radius: var(--radius-md) !important;
    padding: 16px !important;
    transition: all 0.2s;
}

.z .weui-cell:hover {
    border-color: #ff7b00 !important;
    box-shadow: var(--shadow-sm);
}

/* 价格显示 - 红橙 */
[style*="color:#2888ff"] {
    background: none !important;
    -webkit-text-fill-color: initial !important;
    color: var(--primary-dark) !important;
    font-weight: 700 !important;
}

/* 购买按钮 - 红橙渐变 */
.fix-bottom {
    position: relative !important;
    margin-top: 30px !important;
    margin-bottom: 65px !important;
    padding: 0 15px;
}

.weui-btn.weui-btn_primary.stt {
    width: 100% !important;
    height: 56px !important;
    border-radius: 60px !important;
    background: var(--primary-gradient) !important;
    border: none !important;
    font-weight: 700 !important;
    font-size: 18px !important;
    color: white !important;
    box-shadow: var(--shadow-red) !important;
    transition: all 0.2s !important;
    cursor: pointer;
    letter-spacing: 1px;
}

.weui-btn.weui-btn_primary.stt:active {
    transform: scale(0.96);
    box-shadow: var(--shadow-red);
}

/* 滚动条 - 红橙 */
::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: #fef9f0;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    background: #ff7b00;
    border-radius: 10px;
}

/* 响应式调整 */
@media (max-width: 768px) {
    #header {
        height: 70px;
        padding: 0 15px;
    }
    
    #header-title {
        font-size: 18px;
    }
    
    .main-content {
        margin-top: 90px;
        padding: 15px 0px;
    }
    
    .weui-cells.weui-cells_checkbox.mt0 {
        max-height: 250px;
    }
}

/* 脉冲光效动画 - 红橙 */
@keyframes pulse-glow {
    0% { box-shadow: 0 0 5px rgba(255, 123, 0, 0.3); }
    50% { box-shadow: 0 0 20px rgba(255, 123, 0, 0.5); }
    100% { box-shadow: 0 0 5px rgba(255, 123, 0, 0.3); }
}

.pulse-glow {
    animation: pulse-glow 2s infinite;
}

/* 额外细节：选中时长时复选框光效 */
.weui-check:checked + .weui-icon-checked {
    filter: drop-shadow(0 0 4px #ff7b00);
}

/* 信息ID 样式微调 */
.c9 b {
    font-weight: 500;
    color: var(--text-tertiary);
}

/* 任务描述文字 */
.weui-cell__bd .f14 div div {
    color: var(--text-secondary);
    font-size: 14px;
}
</style>

<!-- ========== 新增：引导弹窗样式（白色卡片+红橙渐变） ========== -->
<style>
.super-modal-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 10001;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
}
.super-modal-container {
    width: 85%;
    max-width: 320px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-lg);

    text-align: center;

}

}
.super-modal-icon svg {

}
.super-modal-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);

    -webkit-text-fill-color: initial;
}
.super-modal-desc {

    color: var(--text-secondary);

}
.super-modal-buttons {
    display: flex;
    gap: 12px;

}
.super-modal-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 60px;
    font-weight: 600;

    cursor: pointer;
    transition: all 0.2s;

}
.super-modal-btn-primary {
    background: var(--primary-gradient);

.super-modal-btn-primary:active {

}
.super-modal-btn-secondary {

@keyframes fadeIn {
    from { opacity: 0; }

}
@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }

</style>

<!-- ========== 修改：增强 AJAX 回调，支持引导弹窗 ========== -->
<script>
$(document).ready(function(){
    // 自定义美观弹窗函数
    function showGuideModal(jumpUrl) {
        // 移除已存在的弹窗
        $('.super-modal-mask').remove();
        var modalHtml = `
            <div class="super-modal-mask">
                <div class="super-modal-container">
                    <div class="super-modal-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </div>
                    <div class="super-modal-title">需要先购买普通头条</div>
                    <div class="super-modal-desc" style="text-align:left;">购买超级头条前需要保持任意1个项目购买了普通头条且未过期</div>
                    <div class="super-modal-buttons">
                        <button class="super-modal-btn super-modal-btn-secondary" id="modal_cancel">取消</button>
                        <button class="super-modal-btn super-modal-btn-primary" id="modal_confirm">立即购买</button>
                    </div>
                </div>
            </div>
        `;
        $('body').append(modalHtml);
        // 绑定事件
        $('#modal_confirm').on('click', function() {
            window.location.href = jumpUrl;
        });
        $('#modal_cancel').on('click', function() {
            $('.super-modal-mask').remove();
        });
        // 点击遮罩关闭
        $('.super-modal-mask').on('click', function(e) {
            if ($(e.target).hasClass('super-modal-mask')) {
                $(this).remove();
            }
        });
    }

    $('#super_buy_btn').on('click', function(){
        var pubid = $('input[name="pubid"]:checked').val();
        var days = $('input[name="days"]:checked').val();
        if(!pubid){layer.msg('请选择要推广的项目');return;}
        if(!days){layer.msg('请选择套餐');return;}
        var formdata = new FormData();
        formdata.append('formhash', '{FORMHASH}');
        formdata.append('pubid', pubid);
        formdata.append('days', days);
        $.ajax({
            type: 'post',
            url: 'plugin.php?id=tb_toutiao&modac=super_main&submodac=fabu',
            data: formdata,
            processData: false,
            contentType: false,
            dataType: 'json',
            success: function(res){
                if(res.rs != 200){
                    // 检查是否需要显示引导弹窗（后端返回格式：错误信息|跳转URL）
                    if(res.msg && res.msg.indexOf('|') > 0){
                        var parts = res.msg.split('|');
                        var errMsg = parts[0];
                        var jumpUrl = parts[1];
                        // 调用自定义弹窗
                        showGuideModal(jumpUrl);
                    } else {
                        layer.msg(res.msg);
                    }
                } else {
                    window.location.href = res.msg;
                }
            },
            error: function(){layer.msg('网络错误，请稍后重试');}
        });
    });
});
</script>

actions:
  - Create and verify an isolated R04 staging snapshot that preserves closed R02 and R03 overlays.
  - Inventory runtime routes query parameters templates AJAX contracts sorting filters and GET side effects before edits.
  - Capture sanitized before evidence for home search category and article-list states at real H5 viewports.
  - Apply the Light Grid discovery system to header search tabs cards lists pagination empty and loading states.
  - Preserve the bottom navigation order destinations active-state logic publish entry and App WebView safe-area contract.
  - Keep headline promotion display and publish entry behavior unchanged; do not enter purchase or publish flows.
  - Remove public UI CDN dependencies from R04-owned templates using versioned local CSS icons and fonts.
  - Fix all R04-owned JavaScript and console errors without editing R05-R09 controllers or templates.
  - Verify initial HTML and AJAX fragments for default query filter category pagination empty and error states.
  - Compare list ordering item IDs hrefs query strings request methods field names response fragment hooks and database counters.
  - Use only GET and isolated fixtures unless a documented reversible write window is strictly necessary.
  - Capture 360x800 390x844 and 430x932 screenshots plus overflow touch contrast console network and resource evidence.
  - Keep GitHub Actions manual-only and do not wait for asynchronous device feedback.
  - Build a server-signed Android APK only if native production source or packaged resources change.
  - Put every newly built server-signed APK on the Desktop; never deliver Debug as formal release.
  - Update ledger source map evidence decisions lessons status next task result and manifest.
  - Run full global drift audit before R04 closeout then continue to R05.

forbidden:
  - Do not edit the production site or reuse the R03 staging directory as an unversioned R04 workspace.
  - Do not change list ranking exposure category membership pagination semantics or promoted-content logic.
  - Do not click publish purchase reward favorite comment message or other write actions.
  - Do not rename routes ac values query parameters template variables AJAX hooks or bottom-nav destinations.
  - Do not expose search terms UID content owner identity private counters or authenticated cookies in evidence.
  - Do not use online Tailwind public Font Awesome public iconfont or another runtime UI CDN.
  - Do not introduce dark page surfaces warm-orange branding oversized marketing heroes or decorative card nesting.
  - Do not modify R05-R09 page templates merely because they share legacy CSS or scripts.
  - Do not restore GitHub Actions automatic triggers or wait for asynchronous owner feedback.

acceptance:
  - All 4 R04 page IDs have exact source protocol visual and state evidence.
  - Home search category and article list retain ordering routes filters pagination and AJAX behavior.
  - Default populated empty loading and safely reachable error states use the same business meanings.
  - Three H5 viewports have no horizontal overflow clipped controls status-bar overlap or text below 16px in inputs.
  - Header search tabs cards lists pagination and bottom navigation use the approved light visual system.
  - R04 runtime assets use local versioned CSS icons and fonts with no new public UI CDN.
  - R04-owned console errors and resource failures are zero or have a source-hash-proven cross-version owner.
  - Database counters and production stable-code hash prove no unauthorized side effects or production changes.
  - R04_RESULT.md and the global drift audit pass.
  - CURRENT_STATUS.yaml NEXT_TASK.yaml evidence decisions lessons and manifest are synchronized.

on_success:

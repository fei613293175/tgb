actions:
  - Create android-app Kotlin project with applicationId com.suewammes.tuiguangbao.
  - Lock Gradle Wrapper AGP Kotlin compileSdk targetSdk minSdk and dependency verification.
  - Implement a light-only branded splash and adaptive icons from the approved logo.
  - Implement a single-activity WebView with HTTPS host allowlist and safe browser fallback.
  - Apply WindowInsets so status and navigation bars never overlap H5 content.
  - Implement back navigation target-blank download offline and SSL error handling.
  - Keep WebView page loading automatic and remove the native top progress bar per physical-device feedback.
  - Implement H5 file chooser with Photo Picker or SAF and no broad storage permission.

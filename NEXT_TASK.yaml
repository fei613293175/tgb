  - Generate the formal RSA 4096 keystore outside the handoff and wire signing through environment variables.
  - Build and inspect signed Release APK and ensure size is at least 10485760 bytes without post-sign padding.
  - Run unit lint static secret and APK metadata checks.
  - Run available emulator or device smoke tests; record any unavailable hardware test as an explicit closure blocker.
  - Push the complete handoff and Android source to the authorized GitHub repository.
  - Run GitHub Actions clean build, Android 36 emulator install/start, screenshot, log and regression gates.
  - Treat every CI failure as a fix, rebuild and retest loop; never waive a failed gate to obtain green status.
  - Update native page rows evidence and create version-results/R01_RESULT.md.
  - Run global drift audit and rebuild manifest only after review.

forbidden:

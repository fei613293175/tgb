{template deluser:header}

<style>

    em {
        font-style: normal;
    }

    .top-title {
       background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        font-size: 16px;
        color: #fff;
        padding: 10px;
        text-align: center;
    }

    .item {

        font-size: 0.4rem;


    }

    .item em {
       background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: #fff;
        font-size: 0.35rem;
        height: 23px;
        width: 23px;
        display: inline-block;
        text-align: center;
        vertical-align: middle;
        line-height: 23px;
        border-radius: 50%;
        margin-right: 6px;
        margin-top: -2px;
    }

    .main-tem {
        padding: 20px;
    }

    .item-desc {
        color: #3333339e;
        font-size: 0.35rem;
        margin-left: 26px;
    }
    .tips{
        margin-bottom:15px;
    }

    .btn{
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        font-size: 18px;
        color: #fff;
        border-radius: 30px;
        font-weight: 500;
        width:90%;
        height:50px;
        line-height:50px;
        display:inline-block;



    }
  .layui-layer{
      font-size:0.35rem;
  }
</style>

<style>
    /* 整体头部样式 */
    #header {
        z-index: 999;
       background-color: rgba(255,255,255,0.8)!important;backdrop-filter: blur(15px);
      width: 100%;
      height: 100px;
      font-size: 18px;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      border-bottom:1px solid #f1f1f1;
    }

    /* 返回按钮样式 */
    #back-button {
      margin-top: 150px;  
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    /* 返回按钮文字样式 */
    #back-button span {
      margin-right: 30px;
    }

    /* 标题样式 */
    #header-title {
      color: #000;
      font-weight: 600;
      font-size: 20px;
      margin: 0;
      margin-top: 15px;
    }

  </style>
 <!-- 头部栏 -->
<div id="header" style="margin-top:0px;background-color: rgba(255,255,255,0.8)!important;backdrop-filter: blur(15px);">
    <!-- 返回按钮 -->
    <a href="javascript:window.history.go(-1);">
        <img style="margin-top: 20px;" src="https://img.imehui.com/20250919/175827202768cd1a1b5dc6e.png" alt="返回图标" width="20" height="20">
    </a >
    <!-- 标题 -->
    <h1 id="header-title">申请注销</h1>
    <div style="width: 20px;"></div>
</div>
        <div style="padding:10px 20px;color: #3333339e;font-size:0.39rem;margin-top:105px;">
            我们很遗憾您做出注销帐号的决定，在提交申请前请您仔细阅读以下内容:
        </div>
    </div>

    <div class="main-tem">

        <div class="tips">
            <div class="item">
                <span><em>1</em>确保账号拥有者</span>
            </div>
            <div class="item-desc">
                您应确保您有权决定该账户的注销事宜，不侵犯任何第三方的合法权益，如因此引发任何投诉争议，由您自行承担。
            </div>

        </div>

    

        <div class="tips">
            <div class="item">
                <span><em>2</em>帐号不可找回</span>
            </div>
            <div class="item-desc">
                注销后账号不可找回，您的VIP、积分等所有内容将一并清除，请谨慎操作。
            </div>

        </div>

     

        <div class="tips">
            <div class="item">
                <span><em>3</em>手机号码无法再次注册</span>
            </div>
            <div class="item-desc">
                注销后不能使用该手机号码再次注册。
            </div>
        </div>

   <div class="tips">
            <div class="item">
                <span><em>4</em>注销账号冷静期</span>
            </div>
            <div class="item-desc">
                提交注销账号后，30天后账号信息将会被永久删除，在此期间请不要登录账号，以免影响注销进程，但你可以随时撤回注销，平台不受理提前注销申请。
            </div>

        </div>


    </div>


    <div style="text-align:center">
        <!--{if $userdata}-->
        <div style="font-size:0.4rem;color:red;margin-bottom:20px;">注销进行中</div>
        <a  class="btn cxbtn" href="javascript:void(-1)">撤销申请</a>
        <!--{else}-->
        <a  class="btn gobtn" href="javascript:void(-1)">确定注销</a>
        <!--{/if}-->
    </div>

</div>


<script>

    $(document).on('click',".gobtn",function() {
        layer.open({
            type: 1,
            title: '提示',
            style: 'height:auto;',
            content: "<div style='padding:10px;font-size:0.35rem;'>确认要注销账号吗？</div>",
            area: ['95%', ''],
            btn: ['确定', '取消'],
            yes: function (index, layero) {
                layer.close(index);
                var formdata = new FormData();
                formdata.append('submodac', 'submitdata');
                $.ajax({
                    type: 'post',
                    url: 'plugin.php?id=deluser',
                    data: formdata,
                    processData: false,
                    contentType: false,
                    dataType: 'json',
                    complete: function () {
                    },
                    success: function (data) {
                        if(data.rs != 200){
                            layer.msg(data.msg, {shade: 0.01});
                        }else{
                            layer.msg(data.msg, {shade: 0.01},function (){
                                window.location.reload()
                            });
                        }
                    }
                });

            },
            no: function (index, layero) {
                layer.close(index);
            }
        });

    })

    $(document).on('click',".cxbtn",function() {
        layer.open({
            type: 1,
            title: '提示',
            style: 'height:auto;',
            content: "<div style='padding:10px;font-size:0.35rem;'>确认要撤销申请吗?</div>",
            area: ['95%', ''],
            btn: ['确定', '取消'],
            yes: function (index, layero) {
                layer.close(index);
                var formdata = new FormData();
                formdata.append('submodac', 'canel');
                $.ajax({
                    type: 'post',
                    url: 'plugin.php?id=deluser',
                    data: formdata,
                    processData: false,
                    contentType: false,
                    dataType: 'json',
                    complete: function () {
                    },
                    success: function (data) {
                        if(data.rs != 200){
                            layer.msg(data.msg, {shade: 0.01});
                        }else{
                            layer.msg(data.msg, {shade: 0.01},function (){
                                window.location.href = "plugin.php?id=xigua_hb";
                            });
                        }
                    }
                });

            },
            no: function (index, layero) {
                layer.close(index);
            }
        });

    })

</script>

</body>
</html>

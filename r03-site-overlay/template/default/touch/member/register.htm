    <!-- 验证码弹窗 -->

    <script src="source/plugin/tb_cus_base/static/layer/layer.js">

    <script>
        var jq = jQuery.noConflict();
    </script>

    <script>
        let isUsernameValid = false;

        document.addEventListener('DOMContentLoaded', function() {
            // 始终启用按钮，不依赖昵称检测结果
            const submitBtn = document.querySelector('.btn-primary');
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';

            window.showError = function(elementId, message) {
                const errorElement = document.getElementById(elementId);
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
                const inputId = elementId.replace('_error', '');
                const inputElement = document.getElementById(inputId);
                if (inputElement) {
                    inputElement.classList.add('input-error');
                }
            };

            window.clearError = function(elementId) {
                const errorElement = document.getElementById(elementId);
                errorElement.textContent = '';
                errorElement.classList.add('hidden');
                const inputId = elementId.replace('_error', '');
                const inputElement = document.getElementById(inputId);
                if (inputElement) {
                    inputElement.classList.remove('input-error');
                }
            };

            // 该函数仅更新检测状态，不再影响按钮的禁用/启用
            window.updateSubmitButton = function(valid) {
                isUsernameValid = valid;
                // 按钮状态不再根据检测结果改变，始终保持可用
            };

            const usernameInput = document.getElementById('username');
            usernameInput.addEventListener('input', function() {
                clearError('username_error');
                updateSubmitButton(false); // 仅重置内部状态
            });
        });

        function checkuser() {
            const usernameInput = document.getElementById('username');
            const usernameVal = usernameInput.value.trim();

            if (usernameVal === '') {
                showError('username_error', '请输入昵称');
                updateSubmitButton(false);
                return;
            }
            if (usernameVal.length > 7) {
                showError('username_error', '昵称不能超过7个字符');
                updateSubmitButton(false);
                return;
            }

            const url = `plugin.php?id=tb_cus_mobilereg:checkname&username=${encodeURIComponent(usernameVal)}`;
            fetch(url, {
                    method: 'GET',
                    credentials: 'include'
                })
                .then(response => {
                    if (!response.ok) throw new Error(`请求失败，状态码：${response.status}`);
                    return response.text();
                })
                .then(resp => {
                    const response = resp.trim();
                    if (response) {
                        showError('username_error', response);
                        updateSubmitButton(false);
                    } else {
                        clearError('username_error');
                        updateSubmitButton(true);
                    }
                })
                .catch(error => {
                    showError('username_error', '昵称检测失败，请重试');
                    updateSubmitButton(false);
                    console.error('检测请求异常：', error);
                });
        }

        function checkxieyi() {
            // 不再依赖 isUsernameValid 阻止提交，仅保留昵称非空校验
            if (document.getElementById('username').value.trim() === "") {
                layer.msg("请输入正确昵称", { shade: 0.01 });
                document.getElementById('username').focus();
                return false;
            }
            if (!checkPhonenew(document.getElementById('pnumber').value)) {
                layer.msg("请输入正确手机号", { shade: 0.01 });
                document.getElementById('pnumber').focus();
                return false;
            }
            var pwd1 = document.getElementById('pwd1').value;
            var pwd2 = document.getElementById('pwd2').value;
            if (pwd1.trim() === "") {
                layer.msg("请输入密码", { shade: 0.01 });
                document.getElementById('pwd1').focus();
                return false;
            }
            if (pwd1.length < 6) {
                layer.msg("密码不能小于6位", { shade: 0.01 });
                document.getElementById('pwd1').focus();
                return false;
            }
            if (pwd1 !== pwd2) {
                layer.msg("两次密码输入不一致", { shade: 0.01 });
                document.getElementById('pwd2').focus();
                return false;
            }
            if (!document.getElementById('check1').checked) {
                layer.msg("请阅读并同意服务协议和隐私政策", { shade: 0.01 });
                return false;
            }
            document.getElementById('registerform').classList.add('submitting');
            const submitButton = document.querySelector('.btn-primary');
            const originalHTML = submitButton.innerHTML;
            submitButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 正在提交...';
            submitButton.disabled = true;
            setTimeout(() => {
                document.getElementById('registerform').submit();
            }, 500);
            return false;
        }

        function checkPhonenew(phone) {
            return /^1[3|4|5|6|7|8|9]\d{9}$/.test(phone);
        }

        function sendsmsnew() {
            if (!checkPhonenew(document.getElementById('pnumber').value)) {
                layer.msg("请输入正确手机号", { shade: 0.01 });
                document.getElementById('pnumber').focus();
                return false;
            }
            const getCodeBtn = document.getElementById('getcode1');
            if (getCodeBtn && getCodeBtn.classList.contains('counting')) {
                return;
            }
            document.getElementById('mask').classList.remove('hidden');
            document.getElementById('mask').style.display = 'block';
            document.getElementById('ntcmsg_popmenu').classList.remove('hidden');
            document.getElementById('ntcmsg_popmenu').style.display = 'block';
        }

        function closehongbao() {
            document.getElementById('mask').style.display = 'none';
            document.getElementById('mask').classList.add('hidden');
            document.getElementById('ntcmsg_popmenu').style.display = 'none';
            document.getElementById('ntcmsg_popmenu').classList.add('hidden');
        }

        function submitsendmsg() {
            closehongbao();
            const getCodeBtn = document.getElementById('getcode1');
            if (!getCodeBtn) return;
            let countdown = 60;
            getCodeBtn.disabled = true;
            getCodeBtn.classList.add('counting');
            getCodeBtn.innerHTML = `${countdown}s后重新发送`;
            const timer = setInterval(() => {
                countdown--;
                getCodeBtn.innerHTML = `${countdown}s后重新发送`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    getCodeBtn.disabled = false;
                    getCodeBtn.classList.remove('counting');
                    getCodeBtn.innerHTML = '发送验证码';
                }
            }, 1000);
            layer.msg("验证码已发送，请注意查收", { shade: 0.01, icon: 1 });
        }
    </script>

    {template tb_cus_mobilereg:captcha}
</body>

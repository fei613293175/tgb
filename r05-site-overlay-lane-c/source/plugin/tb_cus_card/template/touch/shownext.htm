                        <script>
                            function removeimgqr(obj) {
                                $.confirm({
                                    title: '删除?',
                                    content: '删除?',
                                    theme:'modern',
                                    columnClass:'medium',
                                    boxWidth: '50%',
                                    useBootstrap: false,
                                    backgroundDismiss: false,
                                    buttons: {
                                        confirm: {
                                            text: '确认',
                                            btnClass: 'btn-blue',
                                            action: function() {
                                                var imgsrc = $(obj).attr("data-img");
                                                $.post("plugin.php?id=tb_cus_card" + "&modac=ajax" + "&submodac=deleteimg", { imgbase64: imgsrc }, function(rs) {
                                                    $(obj).remove();
                                                    return false;
                                                }, 'json');
                                            }
                                        },
                                        cancel: {
                                            text: '取消',
                                            action: function() {}
                                        }
                                    }
                                });
                            }

                            function uploadimgqr(obj) {
                                $.showLoading();
                                lrz(obj.files[0], { width: 750, fieldName: "file" }).then(function(data) {
                                    $.post("plugin.php?id=tb_cus_card" + "&modac=ajax" + "&submodac=uploadimg", { imgbase64: data.base64 }, function(rs) {
                                        $.hideLoading();
                                        $(obj).parent().prev().html('<li onclick="removeimgqr(this)" data-img="'+rs.filename +'" class="weui-uploader__file" style="background-image:url('+rs.src+')"><input value="'+rs.src+'"  type="hidden" name="files"  id="lc_qrpic" /></li>');
                                    },'json');
                                }).then(function(data) {

                                }).catch(function(err) {
                                    console.log(err);
                                });
                            }
                        </script>

<script>
    function copy_new_text() {
        clipboard = new Clipboard("#foo");
        clipboard.on('success', function(e){
           layer.msg("复制成功");
        });
        id.click();
        clipboard.destroy();
    }


    $(document).on('click', "#btn", function () {
        var formData = new FormData();
        $("input[name='files']").each(function(){
                formData.append("files[]",$(this).val());
            }
        )
        formData.append("modac",'upload');
        formData.append("submodac",'addsubmit');
        formData.append("formhash",'{FORMHASH}');
        formData.append("logid",'{$logid}');
        formData.append("tauserinfo",$("#tauserinfo").val());
        $.ajax({
            type: 'POST',
            dataType: 'json',
            data: formData,
            url: "plugin.php?id=tb_cus_card",
            processData : false,
            contentType : false,
            async: false,
            success: function(data) {
                if(data.rs == 200){
                    layer.msg(data.msg);
                    setTimeout(function(){
                        window.location.href="plugin.php?id=tb_cus_card&mptype=2";
                    },2000)
                }else{
                    layer.msg(data.msg);
                }
            },
            error: function(xhr) {}
        })
    })

</script>
